{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 2rem auto;">
    <h2>Teaching Preferences</h2>
    <p style="color: var(--text-secondary); margin-bottom: 2rem;">Select the days you are available to teach. Our AI
        will prioritize these slots.</p>

    <form action="{{ url_for('preferences') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem;">
            {% for day in ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'] %}
            <div
                style="display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: rgba(255,255,255,0.03); border-radius: 8px;">
                <label style="font-weight: 500;">{{ day }}</label>
                <div class="toggle-switch">
                    <input type="checkbox" name="avail_{{ day }}" id="avail_{{ day }}" {% if pref_map.get(day, True)
                        %}checked{% endif %}>
                    <label for="avail_{{ day }}"></label>
                </div>
            </div>
            {% endfor %}
        </div>

        <button type="submit" class="btn" style="width: 100%;">Save Preferences</button>
    </form>
</div>

<style>
    /* Simple Toggle Switch Style */
    .toggle-switch {
        position: relative;
        width: 50px;
        height: 26px;
    }

    .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }

    .toggle-switch label {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #444;
        transition: .4s;
        border-radius: 34px;
    }

    .toggle-switch label:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        transition: .4s;
        border-radius: 50%;
    }

    .toggle-switch input:checked+label {
        background-color: var(--accent-color);
    }

    .toggle-switch input:checked+label:before {
        transform: translateX(24px);
    }
</style>
{% endblock %}
