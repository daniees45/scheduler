{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 4rem auto;">
    <h2 style="text-align: center;">Create New User</h2>
    <p style="color: var(--text-secondary); text-align: center; margin-bottom: 2rem;">Add a new user to the system.</p>

    <form action="{{ url_for('register') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Username</label>
        <input type="text" name="username" required>

        <label>Email Address</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <label>Role</label>
        <select name="role" required
            style="width: 100%; padding: 0.75rem; background: rgba(0,0,0,0.2); border: var(--glass-border); border-radius: var(--radius); color: var(--text-primary); margin-bottom: 1rem;">
            <option value="student">Student</option>
            <option value="lecturer">Lecturer</option>
            <option value="faculty_admin">Faculty Admin</option>
            <option value="super_admin">Super Admin</option>
        </select>

        <button type="submit" class="btn" style="width: 100%;">Create User</button>
    </form>
</div>
{% endblock %}
