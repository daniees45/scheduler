{% extends "base.html" %}

{% block content %}
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <div>
            <h2>Weekly Timetable</h2>
            <p style="color: var(--text-secondary);">Interactive calendar view of the schedule.</p>
        </div>
        <div style="display: flex; gap: 1rem;">
            <a href="{{ url_for('export_pdf') }}" class="btn btn-secondary">Download PDF</a>
            <a href="{{ url_for('export_ics') }}" class="btn btn-secondary">Sync to Google Cal</a>
        </div>
    </div>

    <!-- FullCalendar container -->
    <div id="calendar"
        style="background: rgba(255,255,255,0.03); padding: 1rem; border-radius: 12px; min-height: 600px;"></div>
</div>

<!-- FullCalendar Dependencies -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'timeGridWeek',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'timeGridWeek,timeGridDay'
            },
            slotMinTime: '07:00:00',
            slotMaxTime: '21:00:00',
            hiddenDays: [0, 6], // Hide Sat/Sun if not needed
            allDaySlot: false,
            height: 'auto',
            events: '/api/schedule_events',
            eventClick: function (info) {
                alert('Event: ' + info.event.title + '\nLecturer: ' + info.event.extendedProps.description);
            },
            eventDidMount: function (info) {
                // Premium styling for events
                info.el.style.borderRadius = '8px';
                info.el.style.border = 'none';
                info.el.style.padding = '4px';
                info.el.style.boxShadow = '0 4px 6px rgba(0,0,0,0.1)';
                info.el.style.backgroundColor = 'var(--accent-color)';
            }
        });
        calendar.render();
    });
</script>

<style>
    /* Custom FullCalendar Overrides for Dark Mode */
    .fc {
        color: var(--text-primary);
    }

    .fc-theme-standard td,
    .fc-theme-standard th {
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .fc-timegrid-slot {
        height: 3rem !important;
    }

    .fc-toolbar-title {
        font-size: 1.2rem !important;
        font-weight: 600;
    }

    .fc-button-primary {
        background-color: var(--card-bg) !important;
        border-color: rgba(255, 255, 255, 0.1) !important;
    }

    .fc-button-primary:hover {
        background-color: var(--accent-color) !important;
    }

    .fc-button-active {
        background-color: var(--accent-color) !important;
    }
</style>
{% endblock %}
