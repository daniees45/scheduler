{% extends "base.html" %}

{% block content %}
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Previewing: {{ filename }}</h2>
        <a href="{{ url_for('files') }}" class="btn btn-secondary">Back to Files</a>
    </div>
    <p style="color: var(--text-secondary); margin-bottom: 1rem;">Showing first 50 rows.</p>
</div>

<div class="card" style="overflow-x: auto;">
    <style>
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .data-table th,
        .data-table td {
            padding: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
        }

        .data-table th {
            background: rgba(255, 255, 255, 0.05);
            font-weight: 600;
        }

        .data-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }
    </style>
    {{ table_html | safe }}
</div>
{% endblock %}
